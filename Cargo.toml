[package]
name = "slintyt"
version = "0.1.0"
edition = "2024"

[dependencies]
slint = { version = "1.18.1", features = ["renderer-femtovg", "raw-window-handle-06"] }
libmpv2 = "6"
libmpv2-sys = "4.0.1"
rfd = "0.17.2"
glow = "0.18"
anyhow = "1"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
pbkdf2 = "0.12"
sha1 = "0.10"
sha2 = "0.10"
rusqlite = { version = "0.40", features = ["bundled"] }
shlex = "1"
zeroize = "1"
tempfile = "3"
directories = "6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rustypipe = { version = "0.11.4", default-features = false, features = ["userdata", "rustls-tls-webpki-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "process", "time", "sync", "macros", "io-util"] }

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "5.2", features = ["rt-tokio-crypto-rust"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
souvlaki = "0.8"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
aes-gcm = "0.10"
base64 = "0.22"
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }

[build-dependencies]
slint-build = "1.18.1"

[profile.dev-fast]
inherits = "dev"
debug = 0
